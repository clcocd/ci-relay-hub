name: One-time completed branch cleanup
on:
  push:
    branches: [main]
    paths: ['.github/workflows/cleanup-completed-branches-20261124.yml']
permissions:
  contents: write
  pull-requests: read
  actions: read
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Verify and delete only recorded completed branches
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          while read -r branch sha pr; do
            [[ "$branch" != main ]]
            actual=$(git ls-remote --heads origin "refs/heads/$branch" | cut -f1)
            if [[ -z "$actual" ]]; then echo "Already absent: $branch"; continue; fi
            [[ "$actual" == "$sha" ]]
            open=$(gh api --method GET "repos/$GITHUB_REPOSITORY/pulls" -f state=open -f head="${GITHUB_REPOSITORY_OWNER}:$branch" --jq length)
            [[ "$open" == 0 ]]
            base_open=$(gh api --method GET "repos/$GITHUB_REPOSITORY/pulls" -f state=open -f base="$branch" --jq length)
            [[ "$base_open" == 0 ]]
            if [[ "$pr" != 0 ]]; then
              [[ "$(gh api "repos/$GITHUB_REPOSITORY/pulls/$pr" --jq '.merged')" == true ]]
              [[ "$(gh api "repos/$GITHUB_REPOSITORY/pulls/$pr" --jq '.head.sha')" == "$sha" ]]
              [[ "$(gh api "repos/$GITHUB_REPOSITORY/pulls/$pr" --jq '.head.ref')" == "$branch" ]]
            else
              [[ "$(gh api --method GET "repos/$GITHUB_REPOSITORY/actions/runs" -f branch="$branch" -f per_page=1 --jq '.workflow_runs[0].conclusion')" == success ]]
            fi
            active=$(gh api --paginate --method GET "repos/$GITHUB_REPOSITORY/actions/runs" -f branch="$branch" -f per_page=100 --jq '.workflow_runs[] | select(.status != "completed") | .id')
            [[ -z "$active" ]]
            git push --force-with-lease="refs/heads/$branch:$sha" origin ":refs/heads/$branch"
            [[ -z "$(git ls-remote --heads origin "refs/heads/$branch")" ]]
            echo "Deleted and verified: $branch"
          done <<'BRANCHES'
          chore/dcr-branch-cleanup-20261124 440d8b425740396cec341d05fe491662fda8dd38 13
          feature/verified-beta-dependency-sync 144065c52dc2344b04b29843c5497321d0d961ef 14
          fix/dcr-kotlin-renovate-light-ci-20261124 c0960cb2c6f31d6f2fd1b5af80093cdc15166a84 12
          fix/dcr-renovate-light-ci-20261124 b231515f5d1ec5344969ff31ce68be3c591f1c30 11
          test/dcr-instagram-live-124 8d27fd3296f78ae69b4fcd5eda98cf2978fc489d 0
          test/dcr-x-live-121 46cec0cfbe5850b258979f249fe05f7607cd8dff 0
          BRANCHES
