name: DCR token permission check (temporary)
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/dcr-token-permission-check.yml

jobs:
  check:
    runs-on: ubuntu-latest
    environment: relay-control
    permissions:
      contents: read
    steps:
      - name: Check effective DCR_CI_TOKEN access
        env:
          DCR_TOKEN: ${{ secrets.DCR_CI_TOKEN }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import sys
          import urllib.error
          import urllib.request

          token = os.environ.get("DCR_TOKEN", "")
          if not token:
              print("DCR_CI_TOKEN: MISSING")
              sys.exit(1)

          headers = {
              "Authorization": "Bearer " + token,
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28",
              "Content-Type": "application/json",
          }

          def request(method, path, data=None):
              body = json.dumps(data).encode() if data is not None else None
              req = urllib.request.Request("https://api.github.com" + path, body, headers, method=method)
              try:
                  with urllib.request.urlopen(req, timeout=20) as response:
                      raw = response.read()
                      return response.status, json.loads(raw) if raw else {}
              except urllib.error.HTTPError as error:
                  raw = error.read()
                  try:
                      result = json.loads(raw)
                  except Exception:
                      result = {}
                  return error.code, result

          status, user = request("GET", "/user")
          print("GET /user:", status, "login:", user.get("login"), "message:", user.get("message"))

          status, repo = request("GET", "/repos/clcocd/DCR-Kotlin")
          print("GET /repos/DCR-Kotlin:", status, "permissions:", repo.get("permissions"), "message:", repo.get("message"))

          status, ref = request("GET", "/repos/clcocd/DCR-Kotlin/git/ref/heads/main")
          print("GET /git/ref/heads/main:", status, "message:", ref.get("message"))
          if status != 200:
              sys.exit(1)

          sha = ref["object"]["sha"]
          status, result = request("PATCH", "/repos/clcocd/DCR-Kotlin/git/refs/heads/main", {"sha": sha, "force": False})
          print("PATCH /git/refs/heads/main (same SHA, non-forced):", status, "message:", result.get("message"))
          if status == 200:
              print("PATCH accepted, unchanged_sha:", result.get("object", {}).get("sha") == sha)
          if status != 200:
              sys.exit(1)
          PY
