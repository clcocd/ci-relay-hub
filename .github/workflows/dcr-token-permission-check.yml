name: DCR PAT write permission verification
on:
  push:
    branches: [main]
    paths: [.github/workflows/dcr-token-permission-check.yml]

jobs:
  verify:
    runs-on: ubuntu-latest
    environment: relay-control
    permissions:
      contents: read
    steps:
      - name: Verify token without changing the branch
        env:
          TOKEN: ${{ secrets.DCR_CI_TOKEN }}
        run: |
          python3 - <<'PY'
          import json, os, sys, urllib.request, urllib.error
          token = os.environ.get("TOKEN")
          if not token:
              print("TOKEN MISSING")
              sys.exit(1)
          path = "/repos/clcocd/DCR-Kotlin/git/refs/heads/main"
          headers = {
              "Authorization": "Bearer " + token,
              "Accept": "application/vnd.github+json",
              "Content-Type": "application/json",
              "X-GitHub-Api-Version": "2022-11-28",
          }
          def api(method, path, body=None):
              data = json.dumps(body).encode() if body is not None else None
              req = urllib.request.Request("https://api.github.com" + path, data, headers, method=method)
              try:
                  with urllib.request.urlopen(req, timeout=20) as response:
                      return response.status, json.load(response)
              except urllib.error.HTTPError as error:
                  return error.code, json.load(error)
          code, ref = api("GET", "/repos/clcocd/DCR-Kotlin/git/ref/heads/main")
          print("GET main:", code)
          if code != 200:
              print("message:", ref.get("message"))
              sys.exit(1)
          current = ref["object"]["sha"]
          if current != "e028e8abee238fcbc53a97e7fcbbeba44a37dbcd":
              print("Main changed since last verification: no write attempted")
              sys.exit(2)
          code, result = api("PATCH", path, {"sha": current, "force": False})
          print("PATCH same SHA:", code)
          print("message:", result.get("message", "-"))
          if code == 200:
              print("Branch unchanged:", result.get("object", {}).get("sha") == current)
          sys.exit(0 if code == 200 else 1)
          PY
