name: One-time closed PR branch cleanup
on:
  push:
    branches: [main]
    paths: ['.github/workflows/one-time-closed-pr-branch-cleanup.yml']

permissions:
  contents: write

jobs:
  prune:
    if: github.repository == 'clcocd/ci-relay-hub'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Delete ten closed-PR branches, preserving main
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          while read -r name expected_sha; do
            [[ -n "$name" && "$name" != "main" ]] || continue
            ref="repos/${GITHUB_REPOSITORY}/git/ref/heads/${name}"
            actual_sha=$(gh api "$ref" --jq '.object.sha')
            if [[ "$actual_sha" != "$expected_sha" ]]; then
              echo "::error::Branch changed: $name; refusing deletion."
              exit 1
            fi
            gh api --method DELETE "repos/${GITHUB_REPOSITORY}/git/refs/heads/${name}"
            echo "Deleted: $name"
          done <<'BRANCHES'
          ci/identify-dispatch-runs-20261123 b142f012512e7a7ce5d0d009d2c2ccd7db670db9
          feat/beta-auto-delete-merged-branches-20261123 7e173d047eca2038173e3ff94c99bd8d19aa5aad
          fix/beta-cleanup-existing-token-and-diagnostics-20261123 d1a9823027008d64796554a9676b959fd381e15c
          fix/beta-cleanup-ignore-expected-404-20261123 5bc547756ad50b1a09030d3ff0515554cafc148c
          fix/beta-cleanup-require-control-token-20261123 bc33a51d7120592428348451e506a911362520dd
          fix/beta-cleanup-use-existing-ci-token-20261123 a418a2e1408b711688ec849c8a04c0ff6d22d00c
          fix/beta-verify-jdk22-with-upgraded-ci-jdk 8272f0ddae04237c2f2992079643862c17d13e39
          fix/dcr-delete-merged-pr-branch 205ab55ae620dae9e70e39d464b178ac3a6535ff
          fix/dcr-maven-429-retry-20261123 26fd2a84dd98cc3f04a4fca7d21e0ae515144705
          fix/verify-dispatch-with-worker-20261123 20c1c36c02913c922f0c83d5ea0e989ad8a462e5
          BRANCHES
