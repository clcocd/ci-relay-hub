name: One-time DCR merged branch cleanup
on:
  push:
    branches: [main]
    paths: ['.github/workflows/one-time-dcr-branch-cleanup.yml']
permissions: {}
jobs:
  cleanup:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: relay-control
    timeout-minutes: 5
    steps:
      - name: Delete only verified merged branch refs
        env:
          DCR_CI_TOKEN: ${{ secrets.DCR_CI_TOKEN }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from urllib.request import Request, urlopen
          from urllib.error import HTTPError
          from urllib.parse import quote

          token = os.environ["DCR_CI_TOKEN"]
          repo = "clcocd/DCR-Kotlin"
          expected = {
              "chore/configure-renovate-relay": "d6edfa12f4b6594cba055a0a49d73d2f7c1c02b7",
              "test/verify-relay-automerge-20261123": "7823c4893ad831229140ad5e5d268a88115bb146",
              "fix/x-widget-script-retry-20261123": "e37a8eafe5c153050fecefd9807ebeb46bad804a",
              "chore/remove-temporary-e2e-diagnostics-20261123": "b30fd7924d54fb79275b3004931e481bc25eee15",
          }
          base = f"https://api.github.com/repos/{repo}"
          headers = {
              "Authorization": "Bearer " + token,
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28",
          }

          def request(method, url):
              with urlopen(Request(url, method=method, headers=headers), timeout=20) as response:
                  return response.status, response.read()

          for branch, sha in expected.items():
              ref = base + "/git/ref/heads/" + quote(branch, safe="/")
              try:
                  _, body = request("GET", ref)
              except HTTPError as error:
                  if error.code == 404:
                      print("Already absent:", branch)
                      continue
                  raise
              current = json.loads(body)["object"]["sha"]
              if current != sha:
                  raise RuntimeError(f"Ref changed, refusing deletion: {branch}")
              _, body = request("GET", base + "/compare/main..." + quote(branch, safe="/"))
              if json.loads(body)["ahead_by"] != 0:
                  raise RuntimeError(f"Ref contains unmerged commits, refusing deletion: {branch}")
              status, _ = request("DELETE", base + "/git/refs/heads/" + quote(branch, safe="/"))
              if status != 204:
                  raise RuntimeError(f"Unexpected delete response: {branch}, {status}")
              try:
                  request("GET", ref)
              except HTTPError as error:
                  if error.code == 404:
                      print("Deleted and verified:", branch)
                      continue
                  raise
              raise RuntimeError(f"Ref still exists: {branch}")
          PY
