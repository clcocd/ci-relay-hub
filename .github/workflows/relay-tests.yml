name: CI relay tests

on:
  pull_request:
    paths: ['.github/workflows/**', 'scripts/**', 'tests/**', 'worker/**', 'wrangler.toml']

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - run: python3 -m unittest discover -s tests
      - name: Parse all relay workflow YAML files
        run: ruby -e 'require "yaml"; Dir[".github/workflows/*.{yml,yaml}"].each { |f| YAML.load_file(f) }'
      - run: node --test tests/worker.test.mjs
