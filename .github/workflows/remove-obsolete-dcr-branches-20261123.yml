name: One-time DCR closed PR branch cleanup
on:
  push:
    branches: [main]
    paths: [.github/workflows/remove-obsolete-dcr-branches-20261123.yml]

permissions: {}

jobs:
  cleanup:
    runs-on: ubuntu-latest
    environment: relay-control
    timeout-minutes: 5
    steps:
      - name: Delete two obsolete closed PR branches with exact SHA checks
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.DCR_CI_TOKEN }}
        run: |
          set -euo pipefail
          test -n "${GH_TOKEN:-}"
          cleanup() {
            local number="$1" branch="$2" expected="$3"
            local state head
            state="$(gh api "repos/clcocd/DCR-Kotlin/pulls/$number" --jq .state)"
            test "$state" = closed
            head="$(gh api "repos/clcocd/DCR-Kotlin/git/ref/heads/$branch" --jq .object.sha)"
            test "$head" = "$expected"
            gh api -X DELETE "repos/clcocd/DCR-Kotlin/git/refs/heads/$branch"
            echo "Deleted: $branch"
          }
          cleanup 112 fix/x-embed-script-retry 23f6758bfd99ba4235021d2c0806e029d2c940c3
          cleanup 116 test/diagnose-dccon-modal-e2e-20261123 03f5fc016a720949edf4422ec1d1427925437546
